    <title>أُسس للسفر | OSOS Travel</title>

    <meta property="og:title" content="أُسس للسفر | OSOS Travel">
    <meta property="og:description" content="خدمات سفر متكاملة وموافقات أمنية وحجوزات طيران.">

    <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="shortcut icon" href="/public/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OSOS TRAVEL" />

    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#212121',   // الفحمي (للنصوص والعناوين)
                primary: '#D32F2F', // الأحمر الكرزي (للأزرار والشعار)
                gray: '#F9FAFB',    // خلفيات فاتحة
                surface: '#FFFFFF', // خلفية الكروت
                'red-light': '#FEF2F2', // خلفية أيقونات فاتحة
                'red-hover': '#B71C1C', // لون الزر عند الضغط
              }
            },
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],   // للعناوين
              tajawal: ['Tajawal', 'sans-serif'] // للنصوص الطويلة
            },
            borderRadius: {
              'card': '1rem',
            },
            boxShadow: {
              'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07)',
            }
          }
        }
      }
    </script>

    <style>
      body {
        font-family: 'Tajawal', sans-serif; /* الخط الافتراضي */
        background-color: #FFFFFF;
        color: #212121;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cairo', sans-serif; /* خط العناوين */
      }
      /* تحسين شكل شريط التمرير */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #D32F2F; border-radius: 4px; }
    </style>

    <script type="importmap">

        "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
        "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0"
      }
    }
    </script>
  </head>
  <body class="antialiased overflow-x-hidden">
