
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="text-[14px] sm:text-[15px] lg:text-[16px]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasil | واصِل للخدمات السياحية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue: '#004B87',
                coral: '#FF7043',
                gray: '#F8FAFC',
                blueLight: '#005CA8',
                coralLight: '#FF8A65',
                text: '#1E293B',
                accent: '#0EA5E9'
              }
            },
            fontSize: {
              'xs': ['0.7rem', { lineHeight: '1rem' }],
              'sm': ['0.8rem', { lineHeight: '1.2rem' }],
              'base': ['0.9rem', { lineHeight: '1.4rem' }],
              'lg': ['1rem', { lineHeight: '1.6rem' }],
              'xl': ['1.125rem', { lineHeight: '1.75rem' }],
              '2xl': ['1.25rem', { lineHeight: '1.8rem' }],
              '3xl': ['1.5rem', { lineHeight: '2rem' }],
              '4xl': ['2rem', { lineHeight: '2.5rem' }],
              '5xl': ['2.5rem', { lineHeight: '3rem' }],
              '6xl': ['3rem', { lineHeight: '1' }],
            },
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
              inter: ['Inter', 'sans-serif']
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '3rem',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 3s infinite',
              'slide-in': 'slideIn 0.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.8' },
              },
              slideIn: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Cairo', 'Inter', sans-serif;
        scroll-behavior: smooth;
        overflow-x: hidden;
        background-color: #F8FAFC;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .text-gradient {
        background: linear-gradient(135deg, #004B87 0%, #0EA5E9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #004B87;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  </head>
  <body class="selection:bg-brand-coral selection:text-white">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
